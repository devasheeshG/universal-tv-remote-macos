# CI/CD: every push to main builds the app on a macOS runner and publishes a GitHub Release with a DMG containing the .app. Version and release notes are checked in: update VERSION and .docs/releases/v<version>.md together.
#
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Require written release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ -s ".docs/releases/v${RELEASE_VERSION}.md" ]] || {
            echo "Write .docs/releases/v${RELEASE_VERSION}.md before releasing."
            exit 1
          }

      - name: Build app bundle
        run: bash scripts/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Package app in DMG
        run: bash scripts/package-dmg.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Universal TV Remote for Mac v${{ steps.version.outputs.version }}
          files: build/Universal.TV.Remote.for.Mac.dmg
          fail_on_unmatched_files: true
          body_path: .docs/releases/v${{ steps.version.outputs.version }}.md
          generate_release_notes: false
