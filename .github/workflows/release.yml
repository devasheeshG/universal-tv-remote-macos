# CI/CD: every push to main builds the app on a macOS runner and publishes a
# GitHub Release with the zipped .app attached. Pushing a tag like v1.2.3
# releases under that exact version instead of the auto-generated one.
#
# Versioning:
#   push to main   → v1.0.<run number>   (auto-increments forever)
#   push tag v*    → the tag itself
#
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # needed to create releases

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app bundle
        run: bash scripts/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Zip for release
        run: |
          cd build
          # ditto preserves the resource forks/permissions Finder expects.
          ditto -c -k --keepParent "Universal TV Remote.app" "Universal.TV.Remote.for.Mac.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Universal TV Remote for Mac v${{ steps.version.outputs.version }}
          files: build/Universal.TV.Remote.for.Mac.zip
          generate_release_notes: true
          body: |
            Menu-bar remote for Fire TV, Android/Google TV, Samsung, LG and Roku.

            **Install:** unzip, drag to Applications, then **right-click → Open**
            the first time (the app is ad-hoc signed, not notarized).
